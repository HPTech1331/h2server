<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Login — H2 Server | H2 TECHNOLOGY WORLD</title>
  <meta name="description" content="Sign in to H2 Server — H2 TECHNOLOGY WORLD · h2server.online" />
  <meta name="theme-color" content="#070b14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="page-login">
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="glow glow-1" aria-hidden="true"></div>
  <div class="glow glow-2" aria-hidden="true"></div>

  <main class="card login-card">
    <div class="brand">
      <p class="badge">h2server.online</p>
      <h1>Hello</h1>
      <p class="tagline"><span>H2 TECHNOLOGY WORLD</span></p>
      <p class="sub">Sign in to open the main dashboard.</p>
    </div>

    <form class="login-form" id="login-form" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="Enter username"
          required
          autocomplete="username"
          spellcheck="false"
          enterkeyhint="next"
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter password"
            required
            autocomplete="current-password"
            enterkeyhint="go"
          />
          <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Show password">Show</button>
        </div>
      </div>

      <p class="form-error" id="form-error" hidden></p>

      <button type="submit" class="btn-primary" id="login-btn">Sign in</button>
    </form>

    <div class="chips" aria-label="Topics">
      <span>Arduino</span>
      <span>IoT</span>
      <span>PCB</span>
      <span>Embedded</span>
    </div>
  </main>

  <footer>
    <span>&copy; <span id="year"></span> H2 Server · h2server.online</span>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    H2.seedUsers();
    H2.applyBuiltInSheetsConfig();

    if (H2.isLoggedIn()) {
      window.location.replace("main.html");
    }

    var toggle = document.getElementById("toggle-pass");
    var pass = document.getElementById("password");
    toggle.addEventListener("click", function () {
      var show = pass.type === "password";
      pass.type = show ? "text" : "password";
      toggle.textContent = show ? "Hide" : "Show";
      toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });

    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var err = document.getElementById("form-error");
      var username = document.getElementById("username").value.trim();
      var password = document.getElementById("password").value;
      err.hidden = true;

      if (!H2.validateLogin(username, password)) {
        err.textContent = "Invalid username or password.";
        err.hidden = false;
        return;
      }

      H2.setSession(username);
      window.location.href = "main.html";
    });
  </script>
</body>
</html>
